<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMIRCARS — Panel</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#D90429" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <meta name="app-revision" content="{{ app_revision }}" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/amircars/pwa-icon-192.png') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/amircars/pwa-icon-192.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ app_revision }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/catalog.css') }}?v={{ app_revision }}" />
  </head>
  <body class="app-body">
    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <div class="brand-mark">
          <button type="button" id="sync-indicator" data-state="unknown" aria-live="polite">
            <span class="sync-icon">🟠</span>
            <span class="sync-label">Iniciando…</span>
          </button>
        </div>
        <div class="topbar-center">
          <div class="rate-chip" id="rate-chip">Tasa BCV: —</div>
        </div>
        <img class="topbar-logo" src="{{ url_for('static', filename='img/amircars/logo.png') }}" alt="AMIRCARS" />
      </header>
      <aside class="glass sidebar" id="sidebar">
        <div class="sidebar-head">
          <img class="sidebar-logo" src="{{ url_for('static', filename='img/amircars/logo.png') }}" alt="" />
        </div>
        <nav class="nav-list" id="nav-list"></nav>
        <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <button class="btn ghost" type="submit" title="Salir" aria-label="Salir"><span class="nav-icon" aria-hidden="true">⏻</span><span>Salir</span></button>
        </form>
      </aside>
      <main class="glass panel-main" id="view-root"></main>
    </div>
    <script nonce="{{ csp_nonce() }}">
      (function () {
        var build = "{{ app_revision }}";
        if (!navigator.onLine) {
          return;
        }
        fetch("/api/health", { cache: "no-store", credentials: "same-origin" })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            if (!data || !data.revision || String(data.revision) === String(build)) {
              return;
            }
            var key = "amircars-html-" + data.revision;
            var attempts = Number(sessionStorage.getItem(key) || "0");
            if (attempts >= 2) {
              return;
            }
            sessionStorage.setItem(key, String(attempts + 1));
            var done = function () { location.reload(); };
            if (!("caches" in window)) {
              done();
              return;
            }
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (name) { return caches.delete(name); }));
            }).then(done, done);
          })
          .catch(function () {});
      })();
    </script>
    <script src="{{ url_for('static', filename='vendor/dexie.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}?v={{ app_revision }}"></script>
  </body>
</html>
