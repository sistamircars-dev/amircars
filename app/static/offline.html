<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMIRCARS — Sin conexión</title>
    <meta name="theme-color" content="#D90429" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/img/amircars/pwa-icon-192.png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0C10; color: #F5F5F5; font-family: Segoe UI, sans-serif; }
      main { max-width: 28rem; padding: 1.5rem; }
      button { background: #D90429; color: #fff; border: 0; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>AMIRCARS</h1>
      <p>Reconectando. La pantalla se abre sola en cuanto el servidor responde.</p>
      <button type="button" id="open-local">Reintentar</button>
    </main>
    <script>
      document.getElementById("open-local").addEventListener("click", () => {
        location.reload();
      });
      setInterval(() => {
        if (navigator.onLine) {
          location.reload();
        }
      }, 5000);
    </script>
  </body>
</html>
